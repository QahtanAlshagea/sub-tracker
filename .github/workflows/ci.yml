name: CI

on:
  pull_request:
    branches: [ main, develop ]
  push:
    branches: [ main, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter environment
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check code formatting (dart format)
        run: dart format --set-exit-if-changed .

      - name: Static code analysis (flutter analyze)
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Domain layer purity check
        run: |
          if [ -d "lib/features/subscriptions/domain" ]; then
            if grep -rnE "import .*(flutter|drift|sqflite|dart:io|dart:ui)" lib/**/domain/; then
              echo "❌ DOMAIN PURITY VIOLATION: Domain layer must not import Flutter or persistence packages!"
              exit 1
            else
              echo "✅ Domain layer purity verified: Pure Dart."
            fi
          else
            echo "ℹ️ Domain features directory not yet populated."
          fi

      - name: Run automated test suite with coverage
        run: flutter test --coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lcov-coverage
          path: coverage/lcov.info
          if-no-files-found: ignore
